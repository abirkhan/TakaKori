# Netlify deployment
#
# @netlify/plugin-nextjs is installed as a dev dependency and detected
# automatically.
#
# The build command is `verify`, not `build`. Netlify already builds on every
# push, so making that build the gate means a type error, a lint error, or a
# failing test stops the deploy — no GitHub Actions workflow and no `workflow`
# OAuth scope required. See docs/decisions.md ADR-024.
#
# Required environment variables (set in the Netlify UI, not in this file):
#   NEXT_PUBLIC_SUPABASE_URL
#   NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
#   NEXT_PUBLIC_SITE_URL          must match the Supabase redirect allowlist
#
# NOTE: there is no service-role key here, and there should never be one. The
# application needs no privileged access; every query runs as the signed-in user
# under RLS.

[build]
  # verify = typecheck → lint → test → build. The trailing build is the one
  # @netlify/plugin-nextjs would otherwise set for us.
  command = "npm run verify"

[build.environment]
  NODE_VERSION = "24"

# Deploy previews get their own Supabase redirect entry automatically if the
# branch name is included in the allowed redirect patterns in the Supabase
# dashboard. Without that, email confirmation on previews fails silently.

[[plugins]]
  package = "@netlify/plugin-nextjs"