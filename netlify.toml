# Netlify deployment
#
# @netlify/plugin-nextjs is installed as a dev dependency and detected
# automatically.
#
# There is deliberately no `command` override. The plugin sets the build command
# itself, and the gate lives in the npm `postbuild` hook (typecheck → lint →
# test) so Netlify runs exactly the build it expects while a type error, lint
# error, or failing test still stops the deploy. No GitHub Actions workflow and
# no `workflow` OAuth scope needed. See docs/decisions.md ADR-024.
#
# The gate must run AFTER the build, not before: next build generates
# .next/types, which is where Next 16 declares LayoutProps and PageProps for
# route modules. Running tsc first fails on any clean checkout with
# "Cannot find name 'LayoutProps'". It only appeared to pass locally because a
# dev server had left a populated .next behind.
#
# Required environment variables (set in the Netlify UI, not in this file):
#   NEXT_PUBLIC_SUPABASE_URL
#   NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
#   NEXT_PUBLIC_SITE_URL          must match the Supabase redirect allowlist
#
# NOTE: there is no service-role key here, and there should never be one. The
# application needs no privileged access; every query runs as the signed-in user
# under RLS.

[build.environment]
  NODE_VERSION = "24"

# Deploy previews get their own Supabase redirect entry automatically if the
# branch name is included in the allowed redirect patterns in the Supabase
# dashboard. Without that, email confirmation on previews fails silently.

[[plugins]]
  package = "@netlify/plugin-nextjs"

# The service worker must never be served from a cache.
#
# Browsers cache a worker script for up to 24 hours and do not re-check it on
# reload, so a cached `/sw.js` means a user runs last week's offline behaviour
# against this week's JavaScript — failing in ways that read as bugs in the app
# rather than as staleness in the worker.
#
# `Cache-Control` alone is not enough on Netlify: the CDN honours
# `Netlify-CDN-Cache-Control` and its own rules for files it has uploaded, so
# the worker gets an explicit header here. Registration also passes
# `updateViaCache: 'none'`, which opts out of the browser-side HTTP cache too —
# belt and braces, because not every browser made that default change.
#
# `Content-Type` is set explicitly because a worker served as `text/plain` is
# rejected, and a broad rewrite that catches `/sw.js` and serves `index.html`
# would otherwise look like a mysteriously empty registration.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Content-Type = "application/javascript; charset=utf-8"
    Cache-Control = "public, max-age=0, must-revalidate"
    Netlify-CDN-Cache-Control = "no-store"